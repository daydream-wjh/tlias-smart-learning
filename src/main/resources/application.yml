spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/tlias
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:https://oss-cn-shenzhen.aliyuncs.com}
    # 不要把真实的 AccessKey 写进仓库：设置环境变量 ALIYUN_OSS_AK / ALIYUN_OSS_SK 即可
    accessKeyId: ${ALIYUN_OSS_AK:请填写你的AccessKeyId}
    accessKeySecret: ${ALIYUN_OSS_SK:请填写你的AccessKeySecret}
    bucketName: ${ALIYUN_OSS_BUCKET:your-bucket-name}

logging:
  level:
    org.springframework.jdbc.support.jdbcTransactionManager: debug
    springframework.jdbc.core: TRACE
    springframework.jdbc: DEBUG

name: wjh
